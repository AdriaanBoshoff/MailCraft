[package]
name = "openmailclient-net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "IMAP, POP3 and SMTP clients behind a connector, and an in-process fake server for tests"

[lints]
workspace = true

[features]
# The in-process fake server, for this crate's tests and those of the crates above it.
fake = []

[dependencies]
thiserror = { workspace = true }
base64 = { workspace = true }
# The settings a domain publishes for mail programs are XML.
roxmltree = "0.21"

# TLS and the system's credential store are not on the web build, which reaches mail some other way.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
ring = "0.17"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
openmailclient-net = { path = ".", features = ["fake"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
