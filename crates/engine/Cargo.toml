[package]
name = "mailcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MailCraft engine: session, stores, command registry, Outlook feature catalog, sample mailbox"

[lints]
workspace = true

[dependencies]
mailcraft-model = { workspace = true }
mailcraft-mime = { workspace = true }
mailcraft-msg = { workspace = true }
mailcraft-pst = { workspace = true }
mailcraft-formats = { workspace = true }
mailcraft-fonts = { workspace = true }
mailcraft-layout = { workspace = true }
mailcraft-pdf = { workspace = true }
# Decodes the pictures a message body shows.
image = { workspace = true, features = ["jpeg", "gif", "bmp"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
# Builds the attached objects the tests read.
cfb = { workspace = true }
