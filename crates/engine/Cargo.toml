[package]
name = "openmailclient-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenMailClient engine: session, stores, command registry, Outlook feature catalog, sample mailbox"

[lints]
workspace = true

[dependencies]
openmailclient-model = { workspace = true }
openmailclient-mime = { workspace = true }
openmailclient-msg = { workspace = true }
openmailclient-pst = { workspace = true }
openmailclient-formats = { workspace = true }
openmailclient-fonts = { workspace = true }
openmailclient-layout = { workspace = true }
openmailclient-render = { workspace = true }
openmailclient-pdf = { workspace = true }
# Decodes the pictures a message body shows.
image = { workspace = true, features = ["jpeg", "gif", "bmp"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
# Builds the attached objects the tests read.
cfb = { workspace = true }
