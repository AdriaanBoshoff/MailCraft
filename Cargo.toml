[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
# internal
openmailclient-model = { path = "crates/model" }
openmailclient-fonts = { path = "crates/fonts" }
openmailclient-mime = { path = "crates/mime" }
openmailclient-msg = { path = "crates/msg" }
openmailclient-pst = { path = "crates/pst" }
openmailclient-formats = { path = "crates/formats" }
openmailclient-pdf = { path = "crates/pdf" }
openmailclient-layout = { path = "crates/layout" }
openmailclient-render = { path = "crates/render" }
openmailclient-engine = { path = "crates/engine" }
openmailclient-ui-egui = { path = "crates/ui-egui" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
base64 = "0.22"
# Legacy code pages in MIME parts and ANSI data files.
encoding_rs = "0.8"
# Compound File Binary container ([MS-CFB]) under .msg/.oft.
cfb = "0.15"
uuid = "1"
# Local time zone for display only; the model stores UTC FILETIME ticks.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Installed fonts by family name; no font is bundled through it.
fontdb = "0.24"
# The font reader egui itself uses; here it only checks a font file before egui is given it.
skrifa = "0.44"
# Shapes text from a font's own tables (a port of HarfBuzz to Rust; MIT).
harfrust = "0.12"
# The Unicode Bidirectional Algorithm (UAX #9): the order right-to-left text is drawn in.
unicode-bidi = { version = "0.3", default-features = false, features = ["hardcoded-data"] }
# zlib streams in PDF files.
miniz_oxide = "0.8"

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
# `chunks_exact` reads the same for constant and computed sizes; keep one idiom.
chunks_exact_to_as_chunks = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
