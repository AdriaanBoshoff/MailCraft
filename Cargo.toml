[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
# internal
mailcraft-model = { path = "crates/model" }
mailcraft-mime = { path = "crates/mime" }
mailcraft-msg = { path = "crates/msg" }
mailcraft-pst = { path = "crates/pst" }
mailcraft-formats = { path = "crates/formats" }
mailcraft-engine = { path = "crates/engine" }
mailcraft-ui-egui = { path = "crates/ui-egui" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
base64 = "0.22"
# Legacy code pages in MIME parts and ANSI data files.
encoding_rs = "0.8"
# Compound File Binary container ([MS-CFB]) under .msg/.oft.
cfb = "0.15"
uuid = "1"
# Local time zone for display only; the model stores UTC FILETIME ticks.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
# `chunks_exact` reads the same for constant and computed sizes; keep one idiom.
chunks_exact_to_as_chunks = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
