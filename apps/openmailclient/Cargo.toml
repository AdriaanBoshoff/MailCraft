[package]
name = "openmailclient"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "OpenMailClient desktop app"

[lints]
workspace = true

[dependencies]
openmailclient-engine = { workspace = true }
openmailclient-ui-egui = { workspace = true }
openmailclient-formats = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }
serde_json = { workspace = true }

# The new-mail chime, made in code (`chime.rs`); other systems hand it to their own player.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rodio = { version = "0.20.1", default-features = false }
